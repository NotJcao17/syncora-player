<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <title>Music App - Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-background text-primary antialiased">
    <!-- STORY WRAP VIEW -->
    <div class="flex-1 flex flex-col h-full bg-gradient-to-br from-indigo-900 via-purple-900 to-background relative overflow-hidden">
        
        <!-- Progress Bars -->
        <div class="absolute top-0 inset-x-0 pt-safe px-4 py-4 flex gap-1 z-50">
            <div class="flex-1 h-1 bg-white/30 rounded-full overflow-hidden">
                <div class="h-full bg-white w-full rounded-full"></div>
            </div>
            <div class="flex-1 h-1 bg-white/30 rounded-full overflow-hidden">
                <div class="h-full bg-white w-1/2 rounded-full"></div>
            </div>
            <div class="flex-1 h-1 bg-white/30 rounded-full overflow-hidden"></div>
            <div class="flex-1 h-1 bg-white/30 rounded-full overflow-hidden"></div>
        </div>

        <!-- Header -->
        <header class="absolute top-10 inset-x-0 px-6 py-4 flex justify-between items-center z-50">
            <div class="flex items-center gap-2">
                <i data-lucide="music" class="w-5 h-5 text-white"></i>
                <span class="font-bold text-white tracking-widest uppercase text-xs">Syncora Stats</span>
            </div>
            <a href="index.html" class="w-8 h-8 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center text-white"><i data-lucide="x" class="w-5 h-5"></i></a>
        </header>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col items-center justify-center p-8 text-center relative z-10">
            <h2 class="text-3xl font-bold text-white/80 mb-2">You listened to</h2>
            <h1 class="text-7xl font-bold text-white mb-8 drop-shadow-lg">42,109</h1>
            <h2 class="text-2xl font-bold text-white/80">minutes of music this year.</h2>
            <p class="mt-8 text-white/60 text-lg">That's more than 92% of listeners in your country.</p>
        </div>

        <!-- Controls (Tap areas) -->
        <div class="absolute inset-y-0 left-0 w-1/3 z-40 cursor-pointer"></div>
        <div class="absolute inset-y-0 right-0 w-2/3 z-40 cursor-pointer"></div>
        
        <!-- Footer actions -->
        <div class="absolute bottom-0 inset-x-0 pb-safe p-6 flex justify-center z-50">
            <button class="px-6 py-3 bg-white text-black rounded-full font-bold shadow-lg hover:scale-105 transition-transform flex items-center gap-2">
                <i data-lucide="share" class="w-4 h-4"></i> Share
            </button>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
