<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <title>Music App - Settings</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-background text-primary antialiased relative">

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col h-full relative overflow-y-auto scroll-smooth">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-40 bg-background/95 backdrop-blur-md px-4 py-3 lg:px-8 lg:py-4 flex items-center gap-4 pt-safe lg:pt-4 border-b border-surface">
            <a href="index.html" class="w-10 h-10 rounded-full hover:bg-surface flex items-center justify-center text-primary transition-colors"><i data-lucide="arrow-left" class="w-6 h-6"></i></a>
            <h1 class="font-bold text-xl tracking-tight">Settings</h1>
        </header>

        <!-- CONTENT -->
        <div class="p-4 lg:p-8 flex flex-col gap-6 max-w-3xl mx-auto w-full pb-20">
            
            <!-- Profile Section -->
            <div class="flex items-center gap-4 p-4 rounded-2xl bg-surface">
                <div class="relative w-16 h-16 rounded-full overflow-hidden bg-surface-hover">
                    <img src="https://i.pravatar.cc/150?img=11" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center cursor-pointer hover:bg-black/60 transition-colors">
                        <i data-lucide="camera" class="w-5 h-5 text-white"></i>
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <h2 class="text-xl font-bold truncate">Alex Doe</h2>
                    <p class="text-sm text-secondary truncate">Syncora Premium Member</p>
                </div>
            </div>

            <!-- Settings Groups -->
            <section class="flex flex-col gap-2">
                <h3 class="text-xs font-bold text-secondary uppercase tracking-widest px-2 mt-4 mb-2">Playback & Data</h3>
                
                <div class="flex items-center justify-between p-4 rounded-xl hover:bg-surface transition-colors cursor-pointer">
                    <div class="flex flex-col">
                        <h4 class="font-semibold text-base">Audio Quality</h4>
                        <p class="text-xs text-secondary">High (320kbps)</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-secondary"></i>
                </div>
                
                <div class="flex items-center justify-between p-4 rounded-xl hover:bg-surface transition-colors cursor-pointer">
                    <div class="flex flex-col">
                        <h4 class="font-semibold text-base">Download over Wi-Fi only</h4>
                        <p class="text-xs text-secondary">Save cellular data</p>
                    </div>
                    <!-- Toggle Switch -->
                    <div class="w-12 h-6 bg-primary rounded-full relative shadow-glow">
                        <div class="absolute right-1 top-1 w-4 h-4 bg-background rounded-full"></div>
                    </div>
                </div>

                <div class="flex items-center justify-between p-4 rounded-xl hover:bg-surface transition-colors cursor-pointer">
                    <div class="flex flex-col">
                        <h4 class="font-semibold text-base">Sleep Timer</h4>
                        <p class="text-xs text-secondary">Off</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-secondary"></i>
                </div>
            </section>

            <section class="flex flex-col gap-2">
                <h3 class="text-xs font-bold text-secondary uppercase tracking-widest px-2 mt-4 mb-2">Storage</h3>
                
                <div class="p-4 rounded-xl bg-surface flex flex-col gap-4">
                    <div class="flex items-center justify-between">
                        <h4 class="font-semibold text-base">Device Storage</h4>
                        <span class="text-xs text-secondary">4.2 GB free</span>
                    </div>
                    <div class="w-full h-2 rounded-full bg-surface-hover overflow-hidden flex">
                        <div class="h-full bg-primary w-1/3"></div>
                        <div class="h-full bg-secondary w-1/4"></div>
                    </div>
                    <div class="flex items-center gap-4 text-xs font-medium">
                        <div class="flex items-center gap-1 text-primary"><div class="w-2 h-2 rounded-full bg-primary"></div> Syncora (1.2 GB)</div>
                        <div class="flex items-center gap-1 text-secondary"><div class="w-2 h-2 rounded-full bg-secondary"></div> Other (6.4 GB)</div>
                    </div>
                    
                    <button class="mt-2 py-2 px-4 border border-surface-hover rounded-lg text-sm font-semibold hover:bg-surface-hover transition-colors">Clear Cache & Downloads</button>
                </div>
            </section>

            <section class="flex flex-col gap-2">
                <h3 class="text-xs font-bold text-secondary uppercase tracking-widest px-2 mt-4 mb-2">About</h3>
                
                <div class="flex items-center justify-between p-4 rounded-xl hover:bg-surface transition-colors cursor-pointer">
                    <h4 class="font-semibold text-base">Privacy Policy</h4>
                    <i data-lucide="external-link" class="w-4 h-4 text-secondary"></i>
                </div>
                
                <div class="flex items-center justify-between p-4 rounded-xl hover:bg-surface transition-colors cursor-pointer">
                    <h4 class="font-semibold text-base">Terms of Service</h4>
                    <i data-lucide="external-link" class="w-4 h-4 text-secondary"></i>
                </div>
                
                <div class="p-4 flex justify-center">
                    <p class="text-xs text-secondary">Syncora v1.0.0 (Build 42)</p>
                </div>
            </section>

        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
